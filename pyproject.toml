[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narration-pipeline"
version = "0.1.0"
description = "Narration scripts for explainer videos: sourced facts, prose to a speech-time budget, deterministic checks with repairs, and an exact cut into frames."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "David Cherbayev" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
narration = "narration.cli:main"

[tool.setuptools]
packages = ["narration"]

[tool.setuptools.package-data]
narration = ["channels/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
